name: Website auth and database contracts

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  auth-and-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: obrenna_test
          POSTGRES_PASSWORD: obrenna_test
          POSTGRES_DB: obrenna_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obrenna_test -d obrenna_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: En-login-inc/Obrenna
          path: GrebGlob
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: GrebGlob/backend/requirements.lock.txt
      - name: Install PostgreSQL 16 backup utilities
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client-16
      - run: npm ci
      - name: Install locked desktop backend dependencies for the cross-repository contract test
        working-directory: GrebGlob/backend
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: npm run test:auth
        env:
          OBRENNA_SHARED_CONTRACT: ${{ github.workspace }}/GrebGlob/shared/desktop-inference-auth-contract.json
      - run: npm run test:portal-integration
        env:
          OBRENNA_BACKEND_ROOT: ${{ github.workspace }}/GrebGlob/backend
          OBRENNA_BACKEND_PYTHON: python
          OBRENNA_REQUIRE_BACKEND_INTEGRATION: '1'
      - run: npm run test:auth:migrations:postgres
        env:
          MIGRATION_TEST_ADMIN_URL: postgres://obrenna_test:obrenna_test@127.0.0.1:5432/obrenna_test
      - run: npm run build
      - run: npm run test:auth:desktop-postgres
        env:
          MIGRATION_TEST_ADMIN_URL: postgres://obrenna_test:obrenna_test@127.0.0.1:5432/obrenna_test
