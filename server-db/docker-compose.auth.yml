services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: obrenna-postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: obrenna-server-db
      POSTGRES_USER: obrenna
      POSTGRES_PASSWORD: obrenna
    ports:
      - '5432:5432'
    volumes:
      - obrenna_server_db_pgdata:/var/lib/postgresql/data
      - ./auth-schema-postgres.sql:/docker-entrypoint-initdb.d/01-auth-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U obrenna -d obrenna-server-db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  obrenna_server_db_pgdata:
